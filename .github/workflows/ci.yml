name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate runner bundle
        run: npm run gen:runner

      - name: Type-check (app)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Type-check (node)
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # On version tags, also produce the Chrome Web Store zip as a release artifact.
      - name: Build Web Store package
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build:webstore

      - name: Upload Web Store package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: apitiser-chrome-webstore
          path: apitiser-chrome-webstore.zip
          if-no-files-found: error

  e2e:
    name: Playwright E2E (unpacked extension)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run build

      # Chrome loads MV3 extensions only in headed mode; xvfb provides a virtual display.
      - name: Run E2E
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
